spring.application.name=Portfolio-Backend

# Server
server.port=8085

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/portfolio-refined-database}

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://mekachi-portfolio.vercel.app}

# Brevo
brevo.api.key=${BREVO_API_KEY}
brevo.from.email=${BREVO_FROM_EMAIL}
brevo.from.name=${BREVO_FROM_NAME}
brevo.notification.to=${BREVO_NOTIFICATION_TO}

# Logging
logging.level.org.springframework.core.env=DEBUG
logging.level.org.springframework.boot.autoconfigure.mongo=DEBUG

spring.profiles.active=dev